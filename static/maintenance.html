<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Maintenance</title>
	<style>
		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			font-family: Arial, Helvetica, sans-serif;
			background: #f3f4f6;
			color: #111827;
		}

		.wrap {
			max-width: 640px;
			margin: 24px;
			padding: 40px 32px;
			text-align: center;
			background: #ffffff;
			border-radius: 16px;
			box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
		}

		.badge {
			width: 72px;
			height: 72px;
			margin: 0 auto 20px;
			border-radius: 50%;
			display: grid;
			place-items: center;
			background: #e0e7ff;
			color: #4338ca;
			font-size: 34px;
			font-weight: 700;
		}

		h1 {
			margin: 0 0 12px;
			font-size: 2rem;
		}

		p {
			margin: 0;
			line-height: 1.6;
			color: #4b5563;
		}

		.note {
			margin-top: 18px;
			font-size: 0.95rem;
			color: #6b7280;
		}
	</style>
</head>
<body>
	<main class="wrap" role="main" aria-labelledby="title">
		<div class="badge" aria-hidden="true">!</div>
		<h1 id="title">We'll be back soon</h1>
		<p>
			Our site is currently undergoing maintenance. We're working to get everything
			back online as quickly as possible.
		</p>
		<p class="note">Please check back later.</p>
	</main>
</body>
</html>
